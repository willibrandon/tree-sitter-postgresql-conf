name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: tree-sitter/setup-action/cli@v2
      - run: tree-sitter generate
      - run: tree-sitter test
      - run: cargo test
