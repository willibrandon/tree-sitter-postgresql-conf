[package]
authors = [ "Brandon Williams" ]
autoexamples = false
categories = [ "parser-implementations", "parsing", "text-editors" ]
description = "PostgreSQL configuration files for tree-sitter: postgresql.conf, pg_hba.conf and pg_ident.conf"
edition = "2024"
keywords = [ "incremental", "parsing", "tree-sitter", "postgresql-conf" ]
license = "MIT"
name = "tree-sitter-postgresql-conf"
readme = "README.md"
repository = "https://github.com/willibrandon/tree-sitter-postgresql-conf"
version = "0.1.0"

build = "bindings/rust/build.rs"
include = [ "bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json", "/LICENSE" ]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27"
